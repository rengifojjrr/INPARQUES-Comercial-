<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Jornada de Inspección - Inparques Ranger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#a4d0b8",
                        "surface": "#fbf9f3",
                        "on-surface-variant": "#3f4942",
                        "secondary-fixed": "#c0edd4",
                        "inverse-surface": "#30312d",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed": "#0f1e19",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#cadbd2",
                        "on-surface": "#1b1c18",
                        "error": "#ba1a1a",
                        "outline-variant": "#bfc9c0",
                        "surface-container": "#f0eee8",
                        "on-primary-fixed": "#002111",
                        "on-secondary-fixed": "#002114",
                        "secondary-container": "#c0edd4",
                        "secondary": "#3e6753",
                        "on-error": "#ffffff",
                        "on-primary-fixed-variant": "#005232",
                        "outline": "#6f7a71",
                        "on-secondary-fixed-variant": "#264e3c",
                        "on-background": "#1b1c18",
                        "primary-fixed": "#a4f4c3",
                        "surface-bright": "#fbf9f3",
                        "surface-dim": "#dcdad4",
                        "inverse-primary": "#88d7a8",
                        "tertiary-fixed-dim": "#b9cbc1",
                        "inverse-on-surface": "#f3f1eb",
                        "surface-container-high": "#eae8e2",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#516159",
                        "primary-container": "#176b45",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#3a4a43",
                        "tertiary": "#3a4942",
                        "surface-variant": "#e4e2dd",
                        "surface-container-low": "#f5f3ed",
                        "on-primary-container": "#99e9b9",
                        "primary": "#005131",
                        "background": "#fbf9f3",
                        "on-secondary-container": "#446d59",
                        "tertiary-fixed": "#d5e7dd",
                        "surface-container-highest": "#e4e2dd",
                        "primary-fixed-dim": "#88d7a8",
                        "surface-tint": "#186c45"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "8px",
                        "xxl": "48px",
                        "lg": "24px",
                        "touch-target": "44px",
                        "xl": "32px",
                        "md": "16px",
                        "base": "4px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "label-md": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "label-sm": ["Manrope"],
                        "body-md": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.surface'); color: theme('colors.on-surface'); }
    </style>
</head>
<body class="font-body-md text-body-md antialiased md:hidden flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-background fixed w-full top-0 z-40 border-b border-outline-variant dark:border-on-surface-variant flex justify-between items-center px-md h-touch-target">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant text-sm">person</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed tracking-tight">Inparques Ranger</h1>
</div>
<button class="w-touch-target h-touch-target flex items-center justify-center text-primary dark:text-primary-fixed hover:bg-surface-container-high dark:hover:bg-on-surface-variant transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-[72px] pb-[96px] px-md flex flex-col gap-lg">
<!-- Context Header -->
<section class="flex flex-col gap-xs pt-sm">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Sector Actual</p>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface flex items-center gap-xs">
<span class="material-symbols-outlined text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">park</span>
                PN El Ávila
            </h2>
<div class="flex flex-wrap gap-sm mt-sm">
<!-- Status Chip: Offline -->
<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-error-container/20 border border-error-container">
<span class="material-symbols-outlined text-[16px] text-error">wifi_off</span>
<span class="font-label-md text-label-md text-error">Modo Offline</span>
</div>
<!-- Status Chip: Sync -->
<div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-high border border-outline-variant">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">cloud_sync</span>
<span class="font-label-md text-label-md text-on-surface-variant">5 por sincronizar</span>
</div>
</div>
</section>
<!-- Primary Actions (Bento Grid) -->
<section class="grid grid-cols-2 gap-sm">
<button class="col-span-2 flex items-center justify-center gap-sm bg-primary-container text-on-primary rounded-lg min-h-[64px] shadow-sm hover:shadow-md transition-shadow active:scale-[0.98]">
<span class="material-symbols-outlined text-[24px]">explore</span>
<span class="font-label-md text-label-md text-lg">Iniciar recorrido</span>
</button>
<button class="col-span-2 flex items-center justify-center gap-sm bg-surface-container-lowest border border-outline-variant text-on-surface rounded-lg min-h-[56px] shadow-sm hover:bg-surface-container transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-[24px] text-primary">qr_code_scanner</span>
<span class="font-label-md text-label-md">Escanear QR</span>
</button>
</section>
<!-- Dashboard Summary (Bento Grid) -->
<section class="grid grid-cols-2 gap-sm">
<!-- Tasks -->
<div class="col-span-2 bg-surface-container-lowest border border-outline-variant rounded-lg p-md shadow-sm flex items-center justify-between">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined">assignment</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant">TAREAS ASIGNADAS</p>
<p class="font-headline-md text-headline-md text-on-surface">3 Pendientes</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
<!-- Overdue -->
<div class="bg-error-container/10 border border-error-container/30 rounded-lg p-md shadow-sm flex flex-col gap-sm">
<div class="w-8 h-8 rounded-full bg-error text-on-error flex items-center justify-center">
<span class="material-symbols-outlined text-sm">schedule</span>
</div>
<div>
<p class="font-headline-md text-headline-md text-error">1</p>
<p class="font-label-sm text-label-sm text-error/80 leading-tight">Inspección<br/>Vencida</p>
</div>
</div>
<!-- Urgent Incidents -->
<div class="bg-surface-container-lowest border border-error/50 rounded-lg p-md shadow-sm flex flex-col gap-sm relative overflow-hidden">
<div class="absolute top-0 right-0 w-16 h-16 bg-error/5 rounded-bl-full"></div>
<div class="w-8 h-8 rounded-full bg-error-container text-on-error-container flex items-center justify-center">
<span class="material-symbols-outlined text-sm">report_problem</span>
</div>
<div>
<p class="font-headline-md text-headline-md text-on-surface">2</p>
<p class="font-label-sm text-label-sm text-on-surface-variant leading-tight">Incidentes<br/>Urgentes</p>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-xxl bg-surface dark:bg-on-background px-xs pb-safe border-t border-outline-variant dark:border-on-surface-variant shadow-[0_-2px_8px_rgba(40,51,46,0.04)]">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-fixed-variant text-on-secondary-container dark:text-secondary-fixed rounded-full px-4 py-1 scale-95 active:scale-90 transition-transform duration-150 min-w-[64px] min-h-[44px]">
<span class="material-symbols-outlined text-[24px]" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm mt-0.5">Home</span>
</button>
<!-- Scan (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container dark:hover:bg-on-surface-variant scale-95 active:scale-90 transition-transform duration-150 min-w-[64px] min-h-[44px] rounded-full">
<span class="material-symbols-outlined text-[24px]" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-label-sm text-label-sm mt-0.5">Scan</span>
</button>
<!-- Inspections (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container dark:hover:bg-on-surface-variant scale-95 active:scale-90 transition-transform duration-150 min-w-[64px] min-h-[44px] rounded-full">
<span class="material-symbols-outlined text-[24px]" data-icon="assignment">assignment</span>
<span class="font-label-sm text-label-sm mt-0.5">Inspections</span>
</button>
<!-- Incidents (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container dark:hover:bg-on-surface-variant scale-95 active:scale-90 transition-transform duration-150 min-w-[64px] min-h-[44px] rounded-full">
<span class="material-symbols-outlined text-[24px]" data-icon="report_problem">report_problem</span>
<span class="font-label-sm text-label-sm mt-0.5">Incidents</span>
</button>
<!-- Sync (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-1 hover:bg-surface-container dark:hover:bg-on-surface-variant scale-95 active:scale-90 transition-transform duration-150 min-w-[64px] min-h-[44px] rounded-full relative">
<span class="material-symbols-outlined text-[24px]" data-icon="sync">sync</span>
<!-- Notification Dot -->
<span class="absolute top-1 right-3 w-2 h-2 bg-error rounded-full border border-surface"></span>
<span class="font-label-sm text-label-sm mt-0.5">Sync</span>
</button>
</nav>
</body></html>
