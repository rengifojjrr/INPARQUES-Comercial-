<script>
        // Simple timer logic for demonstration
        let minutes = 12;
        let seconds = 45;
        const timerDisplay = document.getElementById('prep-timer');
        
        setInterval(() => {
            if(seconds === 0) {
                minutes--;
                seconds = 59;
            } else {
                seconds--;
            }
            
            // Format
            const m = minutes < 10 ? '0' + minutes : minutes;
            const s = seconds < 10 ? '0' + seconds : seconds;
            timerDisplay.textContent = `${m}:${s} min`;
            
            // Turn red and blink if under 5 minutes
            if(minutes < 5) {
                timerDisplay.classList.add('animate-pulse');
            }
        }, 1000);
    </script>
